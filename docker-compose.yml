# Sobe a solução completa:  docker compose up --build
# Front: http://localhost:8501   ·   API (docs): http://localhost:8000/docs
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/zela.db
      # O modelo de embeddings é baixado na construção da imagem; este caminho
      # prevalece sobre o MODELOS_CACHE_DIR vazio do .env.
      MODELOS_CACHE_DIR: /app/modelos_cache
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    ports:
      - "8000:8000"
    volumes:
      - zela-dados:/app/data
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000   # o front fala com a API pela rede interna do compose
      API_TIMEOUT_S: "45"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zela-dados:
